<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HI LIQUOR | Design Prototype Gallery</title>
  <style>
    :root { color-scheme: light; --ink:#17201c; --muted:#66716b; --line:#d9ded8; --accent:#174d3d; --paper:#f4f5f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
    header { padding:42px 5vw 30px; border-bottom:1px solid var(--line); background:#fff; }
    h1 { margin:0 0 8px; font:600 clamp(28px,4vw,54px)/1.05 Georgia,serif; letter-spacing:0; }
    header p { max-width:720px; margin:0; color:var(--muted); }
    .meta { display:flex; gap:18px; flex-wrap:wrap; margin-top:20px; color:var(--accent); font-weight:600; }
    main { width:min(1500px,90vw); margin:34px auto 60px; }
    h2 { margin:30px 0 14px; font:600 25px/1.1 Georgia,serif; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
    .grid figure { margin:0; background:#fff; border:1px solid var(--line); cursor:zoom-in; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .grid figure:hover, .grid figure:focus-visible { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 12px 30px rgba(23,77,61,.14); outline:none; }
    figure.featured { border:2px solid var(--accent); }
    figure img { display:block; width:100%; aspect-ratio:3/2; object-fit:cover; background:#e9ece7; }
    figcaption { padding:13px 14px 15px; }
    figcaption strong { display:block; font-size:14px; }
    figcaption small { display:block; margin-top:5px; color:var(--muted); }
    .tag { display:inline-block; margin-top:9px; padding:3px 7px; border:1px solid #b7c8bd; color:var(--accent); font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
    #previewModal[hidden] { display:none; }
    #previewModal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px; background:rgba(10,18,15,.78); }
    .preview-dialog { position:relative; display:grid; grid-template-rows:auto 1fr; width:min(1280px,96vw); max-height:calc(100vh - 48px); overflow:hidden; background:#fff; border:1px solid rgba(255,255,255,.55); box-shadow:0 24px 70px rgba(0,0,0,.36); }
    .preview-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 16px; color:var(--ink); border-bottom:1px solid var(--line); }
    .preview-title { min-width:0; }
    .preview-title strong, .preview-title small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .preview-title small { margin-top:2px; color:var(--muted); }
    .preview-actions { display:flex; flex:0 0 auto; gap:8px; }
    .preview-actions button { width:38px; height:34px; border:1px solid var(--line); background:#fff; color:var(--ink); font:600 18px/1 system-ui,sans-serif; cursor:pointer; }
    .preview-actions button:hover, .preview-actions button:focus-visible { border-color:var(--accent); color:var(--accent); outline:none; }
    .preview-stage { position:relative; display:grid; place-items:center; min-height:0; padding:18px; background:#edf0eb; }
    .preview-stage img { display:block; max-width:100%; max-height:calc(100vh - 150px); width:auto; height:auto; object-fit:contain; }
    body.preview-open { overflow:hidden; }
    @media (max-width:900px) { main { width:92vw; } }
    @media (max-width:520px) { main { width:92vw; } }
  </style>
</head>

  <div id="previewModal" hidden aria-hidden="true">
    <section class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="preview-toolbar">
        <div class="preview-title"><strong id="previewTitle"></strong><small id="previewNote"></small></div>
        <div class="preview-actions">
          <button type="button" id="previousButton" title="Previous prototype" aria-label="Previous prototype">&#8592;</button>
          <button type="button" id="nextButton" title="Next prototype" aria-label="Next prototype">&#8594;</button>
          <button type="button" id="closeButton" title="Close preview" aria-label="Close preview">&times;</button>
        </div>
      </div>
      <div class="preview-stage"><img id="previewImage" alt=""></div>
    </section>
  </div>
  <script>
    (() => {
      const cards = [...document.querySelectorAll('.grid figure')];
      const modal = document.getElementById('previewModal');
      const image = document.getElementById('previewImage');
      const title = document.getElementById('previewTitle');
      const note = document.getElementById('previewNote');
      const closeButton = document.getElementById('closeButton');
      const previousButton = document.getElementById('previousButton');
      const nextButton = document.getElementById('nextButton');
      let activeIndex = 0;
      let lastFocused = null;

      cards.forEach((card, index) => {
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', 'Open ' + card.querySelector('strong').textContent + ' preview');
        card.addEventListener('click', () => openPreview(index));
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openPreview(index);
          }
        });
      });

      function openPreview(index) {
        activeIndex = (index + cards.length) % cards.length;
        const card = cards[activeIndex];
        const cardImage = card.querySelector('img');
        lastFocused = document.activeElement;
        image.src = cardImage.src;
        image.alt = cardImage.alt;
        title.textContent = card.querySelector('strong').textContent;
        note.textContent = card.querySelector('small').textContent + '  ·  ' + (activeIndex + 1) + ' / ' + cards.length;
        modal.hidden = false;
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('preview-open');
        closeButton.focus();
      }

      function closePreview() {
        modal.hidden = true;
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('preview-open');
        if (lastFocused) lastFocused.focus();
      }

      function move(step) {
        openPreview(activeIndex + step);
      }

      closeButton.addEventListener('click', closePreview);
      previousButton.addEventListener('click', () => move(-1));
      nextButton.addEventListener('click', () => move(1));
      modal.addEventListener('click', event => { if (event.target === modal) closePreview(); });
      document.addEventListener('keydown', event => {
        if (modal.hidden) return;
        if (event.key === 'Escape') closePreview();
        if (event.key === 'ArrowLeft') move(-1);
        if (event.key === 'ArrowRight') move(1);
      });
    })();
  </script>
