<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HI LIQUOR / Homepage Landing Page</title>
  <style>
    :root { color-scheme: light; --ink:#151a18; --paper:#f4f1e9; --muted:#69726b; --forest:#123d32; --gold:#bf8a3b; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--paper); color:var(--ink); }
    body { font:14px/1.5 Segoe UI, Arial, sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:20px 5vw; border-bottom:1px solid #d8d7cc; background:#fbfaf6; }
    header strong { font:600 22px/1 Georgia, serif; letter-spacing:.02em; }
    header span { color:var(--muted); }
    main { width:min(1440px, 100%); margin:0 auto; }
    .stage { padding:28px 3vw 42px; }
    .stage img { display:block; width:100%; height:auto; box-shadow:0 18px 50px rgba(21,26,24,.13); }
    footer { padding:18px 5vw 30px; color:var(--muted); text-align:center; }
    @media (max-width:700px) { header { align-items:flex-start; flex-direction:column; gap:8px; } .stage { padding:14px 10px 24px; } }
  </style>
</head>
<body>
  <header><strong>HI LIQUOR</strong><span>Homepage landing direction / 2026</span></header>
  <main><div class="stage"><img src="hi-liquor-homepage-landing-v1.png" alt="Complete HI LIQUOR homepage landing page design"></div></main>
  <footer>Independent spirits / Sydney · Curated for the curious</footer>
</body>
</html>
